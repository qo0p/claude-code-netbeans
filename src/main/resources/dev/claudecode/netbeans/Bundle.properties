OpenIDE-Module-Name=Claude Code
OpenIDE-Module-Display-Category=Tools
OpenIDE-Module-Short-Description=Connects the Claude Code CLI to NetBeans
OpenIDE-Module-Long-Description=\
    Lets the Claude Code CLI work with NetBeans the way it does with VS Code and IntelliJ: \
    proposed edits open as a diff you accept or reject, your editor selection is shared as context, \
    and Tools > Send Selection to Claude Code inserts an @-mention into the prompt.
